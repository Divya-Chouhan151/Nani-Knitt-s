spring:
  application:
    name: auth-service-test
  datasource:
    url: jdbc:h2:mem:authtest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

application:
  security:
    jwt:
      secret-key: dGhpcy1pcy1hLXZlcnktc2VjdXJlLTI1Ni1iaXQtc2VjcmV0LWtleS1mb3ItZGV2ZWxvcG1lbnQtYXVyYS1hdXRoLXNlcnZpY2U=
      access-token-expiration-ms: 900000
      refresh-token-expiration-ms: 604800000
    cors:
      allowed-origins: http://localhost:5173

logging:
  level:
    com.ecommerce.auth: DEBUG
