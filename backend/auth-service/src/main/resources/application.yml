server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/ecommerce_auth}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_batch_fetch_size: 25
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

application:
  security:
    jwt:
      # Default 256-bit base64-encoded secret key for local development
      secret-key: ${JWT_SECRET_KEY:dGhpcy1pcy1hLXZlcnktc2VjdXJlLTI1Ni1iaXQtc2VjcmV0LWtleS1mb3ItZGV2ZWxvcG1lbnQtYXVyYS1hdXRoLXNlcnZpY2U=}
      access-token-expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:86400000} # 24 hours
      refresh-token-expiration-ms: ${JWT_REFRESH_TOKEN_EXPIRATION_MS:604800000} # 7 days
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  payment:
    gateway:
      provider: ${PAYMENT_GATEWAY_PROVIDER:mock}
      razorpay:
        key-id: ${RAZORPAY_KEY_ID:}
        key-secret: ${RAZORPAY_KEY_SECRET:}

logging:
  level:
    com.ecommerce.auth: DEBUG
    org.springframework.security: INFO
