spring:
  application:
    name: product-service-test
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_batch_fetch_size: 25
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    com.ecommerce.product: INFO
    org.testcontainers: INFO
